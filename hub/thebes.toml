[project]
name = "manticore-iso20022-hub"
default_network = "wan"
chain_id = 2026

[networks.wan]
gateway = "https://memphis.mercaturaforum.com"
validators = [
    "https://memphis.mercaturaforum.com/deploy-api/v0",
    "https://memphis.mercaturaforum.com/deploy-api/v1",
    "https://memphis.mercaturaforum.com/deploy-api/v2",
    "https://memphis.mercaturaforum.com/deploy-api/v3",
]
boundary = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.iso20022]
type = "backend-motoko"
cid = "auto"
wasm = "build/iso20022.wasm"
build = 'cd motoko && mops install >/dev/null 2>&1 && mkdir -p ../build && MOC="$(ls "$HOME/.cache/mops/moc/1.4.1/moc" "$HOME/Library/Caches/mops/moc/1.4.1/moc" 2>/dev/null | head -1)" && "$MOC" $(mops sources) -o ../build/iso20022.wasm main.mo'
